    const q = getQueueObj();
    if (!curr) {
      document.getElementById('time-curr').textContent = '0:00';
      document.getElementById('time-dur').textContent = '0:00';
      return;
    }
    const pct = Math.min(1, (q.time || 0) / (curr.duration || 1));
    const bars = document.querySelectorAll('#waveform .wf-bar');
    const playedIdx = Math.floor(pct * (bars.length - 1));
    bars.forEach((b, i) => {
      b.classList.toggle('played', i <= playedIdx);
      b.classList.toggle('head', i === playedIdx && isPlaying);
    });
    document.getElementById('time-curr').textContent = fmtTime(q.time);
    document.getElementById('time-dur').textContent = fmtTime(curr.duration);
  }

  // Перемотка по волне
  const wfContainer = document.getElementById('waveform');
  let scrubbing = false;
  function scrubAt(clientX) {
    const curr = getCurrentTrack();
    const q = getQueueObj();
    if (!curr) return;
    const rect = wfContainer.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    q.time = rel * curr.duration;
    if (IS_NATIVE) window.ShardNative.seekTo(Math.floor(q.time * 1000));
    updateWaveformProgress();
  }
  wfContainer.addEventListener('pointerdown', e => {
    e.stopPropagation();
    scrubbing = true;
    wfContainer.setPointerCapture(e.pointerId);
    scrubAt(e.clientX);
  });
  wfContainer.addEventListener('pointermove', e => { if (scrubbing) scrubAt(e.clientX); });
  wfContainer.addEventListener('pointerup', () => { scrubbing = false; savePlaybackPos(); });
  wfContainer.addEventListener('pointercancel', () => { scrubbing = false; });

  function updatePlayIcon() {
    document.getElementById('play-icon').innerHTML = isPlaying
      ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
      : '<polygon points="8,5 20,12 8,19"/>';
  }

  // --- Поиск ---
  function toggleSearch(open) {
    const overlay = document.getElementById('search-overlay');
    overlay.classList.toggle('open', open);
    if (open) {
      const input = document.getElementById('search-input');
      input.value = '';
      renderSearchResults('');
      setTimeout(() => input.focus(), 140);
    }
  }

  document.getElementById('search-input').addEventListener('input', e => {
    renderSearchResults(e.target.value);
  });

  function renderSearchResults(query) {
    const qStr = query.trim().toLowerCase();
    const list = document.getElementById('search-results');
    list.innerHTML = '';

    const matches = state.tracks.filter(t => {
      if (t.hidden || t.present === false) return false;
      if (!qStr) return true;
      return (
        t.title.toLowerCase().includes(qStr) ||
        t.artist.toLowerCase().includes(qStr) ||
        (t.realFilename || '').toLowerCase().includes(qStr)
      );
    }).slice(0, 60);

    if (!matches.length) {
      list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:32px 0; font-size:13px;">Ничего не найдено</div>';
      return;
    }

    matches.forEach(t => {
      const item = document.createElement('div');
      item.className = 'q-item';
      item.innerHTML = `
        <div class="q-thumb">${buildArtImgHtml(t)}</div>
        <div class="q-info">
          <div class="q-title">${escapeHtml(t.title)}</div>
          <div class="q-artist">${escapeHtml(t.artist)}</div>
        </div>
        <button class="small-action-btn">+ След.</button>
      `;
      item.onclick = () => playTrackImmediately(t.id);
      item.querySelector('.small-action-btn').onclick = e => {
        e.stopPropagation();
        insertPlayNext(t.id);
      };
      list.appendChild(item);
    });
  }

  function insertPlayNext(trackId) {
    const pool = getActivePool(state.activeVibe);
    if (!pool.some(t => t.id === trackId)) {
      state.activeVibe = 'all';
      syncVibeQueue('all');
    }
    const q = getQueueObj();
    if (!q.ids.length) {
      q.ids = [trackId];
      q.index = 0;
    } else {
      const existingAfter = q.ids.indexOf(trackId, q.index + 1);
      if (existingAfter !== -1) q.ids.splice(existingAfter, 1);
      q.ids.splice(q.index + 1, 0, trackId);
    }
    saveState();
    renderFlow();
    haptic(1);
    showToast('Поставлено следующим');
  }

  function playTrackImmediately(trackId) {
    const pool = getActivePool(state.activeVibe);
    if (!pool.some(t => t.id === trackId)) {
      state.activeVibe = 'all';
      syncVibeQueue('all');
    }
    const q = getQueueObj();
    if (!q.ids.length) {
      q.ids = [trackId];
      q.index = 0;
    } else if (q.ids[q.index] !== trackId) {
      const dupIdx = q.ids.indexOf(trackId, q.index + 1);
      if (dupIdx !== -1) q.ids.splice(dupIdx, 1);
      q.ids.splice(q.index + 1, 0, trackId);
      q.index++;
    }
    q.time = 0;
    stopPreview();
    isPlaying = true;
    saveState();
    toggleSearch(false);
    switchTab('flow');
    syncNativeTrack(true);
    renderFlow();
  }

  // --- Шторка (Очередь / Скрытые / База) ---
  function toggleQueueSheet(open) {
    document.getElementById('sheet-backdrop').classList.toggle('open', open);
    document.getElementById('queue-sheet').classList.toggle('open', open);
    if (open) {
      renderSheetContent();
      if (activeSheetTab === 'queue') {
        requestAnimationFrame(() => {
          const cur = document.querySelector('#sheet-content .q-item.current');
          if (cur) cur.scrollIntoView({ block: 'center' });
        });
      }
    }
  }

  function switchSheetTab(tab) {
    activeSheetTab = tab;
    document.getElementById('stab-queue').classList.toggle('active', tab === 'queue');
    document.getElementById('stab-hidden').classList.toggle('active', tab === 'hidden');
    document.getElementById('stab-data').classList.toggle('active', tab === 'data');
    renderSheetContent();
  }

  function renderSheetContent() {
    const hiddenTracks = state.tracks.filter(t => t.hidden && t.present !== false);
    document.getElementById('stab-hidden').textContent = `Скрытые (${hiddenTracks.length})`;
    const body = document.getElementById('sheet-content');
    body.innerHTML = '';

    if (activeSheetTab === 'queue') {
      const q = getQueueObj();
      if (!q.ids.length) {
        body.innerHTML = '<div style="text-align:center; color:var(--muted); padding:32px 0; font-size:13px;">Очередь пуста</div>';
        return;
      }
      q.ids.forEach((id, i) => {
        const t = getTrack(id);
        if (!t) return;
        const item = document.createElement('div');
        item.className = `q-item ${i === q.index ? 'current' : ''} ${i < q.index ? 'past' : ''}`;
        item.onclick = () => jumpToQueueIndex(i);
        item.innerHTML = `
          <div class="q-idx">${i === q.index ? '▶' : i + 1}</div>
          <div class="q-thumb">${buildArtImgHtml(t)}</div>
          <div class="q-info">
            <div class="q-title">${escapeHtml(t.title)}</div>
            <div class="q-artist">${escapeHtml(t.artist)}</div>
          </div>
        `;
        body.appendChild(item);
      });
    } else if (activeSheetTab === 'hidden') {
      if (!hiddenTracks.length) {
        body.innerHTML = '<div style="text-align:center; color:var(--muted); padding:32px 0; font-size:13px;">Скрытых треков нет</div>';
        return;
      }
      hiddenTracks.forEach(t => {
        const item = document.createElement('div');
        item.className = 'q-item';
        item.innerHTML = `
          <div class="q-thumb">${buildArtImgHtml(t)}</div>
          <div class="q-info">
            <div class="q-title">${escapeHtml(t.title)}</div>
            <div class="q-artist">${escapeHtml(t.artist)}</div>
          </div>
          <button class="small-action-btn">Вернуть</button>
        `;
        item.querySelector('.small-action-btn').onclick = e => {
          e.stopPropagation();
          unhideTrackById(t.id);
        };
        body.appendChild(item);
      });
    } else {
      const presentCount = state.tracks.filter(t => t.present !== false).length;
      const favCount = state.tracks.filter(t => t.liked && !t.hidden && t.present !== false).length;

      body.innerHTML = `
        <div class="data-panel">
          <div class="data-card">
            <h4>Библиотека устройства</h4>
            <p>Активных треков: ${presentCount} · Любимых: ${favCount} · Скрытых: ${hiddenTracks.length} · Настроений: ${state.customVibes.length}.<br>Оригинальные аудиофайлы на диске не изменяются.</p>
            <div class="setting-row">
              <span class="setting-label">Игнорировать файлы короче 30с</span>
              <button class="toggle-pill ${state.skipShortAudio ? 'on' : ''}" onclick="toggleSkipShort()">${state.skipShortAudio ? 'ВКЛ' : 'ВЫКЛ'}</button>
            </div>
            <div class="data-btn-row">
              <button class="mini-pill" onclick="scanDeviceLibrary(true)">Пересканировать</button>
              <button class="mini-pill" onclick="toggleQueueSheet(false); openVibesModal()">Настроения</button>
            </div>
          </div>
          <div class="data-card">
            <h4>Резервная копия базы</h4>
            <p>Сохрани все вайбы, лайки, рейтинги и переименования в JSON-файл через системный проводник.</p>
            <div class="data-btn-row">
              <button class="mini-pill" onclick="exportBackupJSON()">Экспорт JSON</button>
              <button class="mini-pill" onclick="importBackupJSON()">Импорт JSON</button>
            </div>
          </div>
        </div>
      `;
    }
  }

  function exportBackupJSON() {
    const filename = `shard-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const payload = JSON.stringify(state, null, 2);
    if (IS_NATIVE) {
      window.ShardNative.exportBackup(payload, filename);
    } else {
      showToast('Доступно в Android-приложении');
    }
  }

  function importBackupJSON() {
    if (IS_NATIVE) {
      window.ShardNative.importBackup();
    } else {
      showToast('Доступно в Android-приложении');
    }
  }

  // --- СВАЙПАЛКА + НАТИВНОЕ ПРЕВЬЮ ---
  function getPreviewStartSec(track) {
    if (!track || !track.duration) return 0;
    return track.duration > 85 ? 30 : Math.floor(track.duration * 0.35);
  }

  function startCardPreview(trackId) {
    const track = getTrack(trackId);
    if (!track || !track.mediaId) return;
    pauseMainPlayer();
    previewTrackId = trackId;
    previewTime = getPreviewStartSec(track);
    if (IS_NATIVE) {
      window.ShardNative.startPreview(track.mediaId, Math.floor(previewTime * 1000));
    }
    updateCardPreviewUI();
  }

  function toggleCardPreview(trackId) {
    const track = getTrack(trackId);
    if (!track || !track.mediaId) return;
    if (previewTrackId === trackId && previewPlaying) {
      previewPlaying = false;
      if (IS_NATIVE) window.ShardNative.setPreviewPlaying(false);
      updateCardPreviewUI();
      return;
    }
    if (previewTrackId !== trackId) {
      startCardPreview(trackId);
      return;
    }
    pauseMainPlayer();
    previewPlaying = true;
    if (IS_NATIVE) window.ShardNative.setPreviewPlaying(true);
    updateCardPreviewUI();
  }

  function stopPreview() {
    previewPlaying = false;
    previewTrackId = null;
    previewTime = 0;
    if (IS_NATIVE) window.ShardNative.stopPreview();
  }

  function updateCardPreviewUI() {
    const topCard = document.querySelector('.swipe-card.top');
    const topId = state.swipeDeckIds[0];
    const track = getTrack(topId);
    if (!topCard || !track) return;

    const badge = topCard.querySelector('.card-preview-badge');
    const fill = topCard.querySelector('.card-scrub-fill');
    const active = previewPlaying && previewTrackId === topId;
    const shownTime = previewTrackId === topId ? previewTime : getPreviewStartSec(track);

    if (badge) {
      badge.classList.toggle('playing', active);
      badge.innerHTML = active
        ? `<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>${fmtTime(shownTime)}</span>`
        : `<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg><span>${fmtTime(shownTime)}</span>`;
    }
    if (fill) {
      const pct = Math.max(0, Math.min(100, (shownTime / (track.duration || 1)) * 100));
      fill.style.width = pct + '%';
    }
  }

  function closeQuickVibePop() {
    document.getElementById('quick-vibe-pop').classList.remove('open');
  }

  document.addEventListener('click', e => {
    const pop = document.getElementById('quick-vibe-pop');
    if (pop.classList.contains('open') && !e.target.closest('#quick-vibe-pop') && !e.target.closest('#leg-right-btn')) {
      closeQuickVibePop();
    }
  });

  function handleRightLegendClick(e) {
    e.stopPropagation();
    if (!state.swipeDeckIds.length || isSwipeAnimating) return;

    if (!state.customVibes.length) {
      openVibesModal();
      return;
    }
    if (state.customVibes.length === 1) {
      triggerSwipeAction('right', state.customVibes[0].id);
      return;
    }

    const pop = document.getElementById('quick-vibe-pop');
    if (pop.classList.contains('open')) {
      closeQuickVibePop();
      return;
    }
    pop.innerHTML = '';
    state.customVibes.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'qvp-item';
      btn.textContent = v.name;
      btn.onclick = () => {
        closeQuickVibePop();
        triggerSwipeAction('right', v.id);
      };
      pop.appendChild(btn);
    });
    pop.classList.add('open');
  }

  function renderRightDropRail() {
    const rail = document.getElementById('right-drop-rail');
    rail.innerHTML = '';
    state.customVibes.forEach(v => {
      const count = getActivePool(v.id).length;
      const slot = document.createElement('div');
      slot.className = 'drop-vibe-slot';
      slot.dataset.vibeId = v.id;
      slot.innerHTML = `<span class="slot-name">${escapeHtml(v.name)}</span><span class="slot-count">${count}</span>`;
      rail.appendChild(slot);
    });

    const rightLbl = document.getElementById('leg-right-label');
    if (state.customVibes.length === 0) rightLbl.textContent = '+ Вайб';
    else if (state.customVibes.length === 1) rightLbl.textContent = state.customVibes[0].name;
    else rightLbl.textContent = 'В вайб';
  }

  function renderSwipeDeck() {
    document.getElementById('unsorted-badge').textContent = state.swipeDeckIds.length;
    const stage = document.getElementById('deck-stage');

    Array.from(stage.children).forEach(ch => {
      if (ch.id !== 'right-drop-rail') ch.remove();
    });
    renderRightDropRail();

    if (!state.swipeDeckIds.length) {
      stopPreview();
      const empty = document.createElement('div');
      empty.style.cssText = 'text-align:center; color:var(--muted); font-size:14px;';
      empty.innerHTML = `Колода разобрана<br><br><button class="mini-pill" onclick="refillSwipeDeck()">Пройтись ещё раз</button>`;
      stage.appendChild(empty);
      return;
    }

    if (state.swipeDeckIds.length > 1) {
      const behindTrack = getTrack(state.swipeDeckIds[1]);
      if (behindTrack) stage.appendChild(createSwipeCard(behindTrack, false));
    }
    const topTrack = getTrack(state.swipeDeckIds[0]);
    if (topTrack) {
      stage.appendChild(createSwipeCard(topTrack, true));
      updateCardPreviewUI();
    }
  }

  function refillSwipeDeck() {
    state.swipeDeckIds = getActivePool('all').map(t => t.id);
    saveState();
    renderSwipeDeck();
    if (state.swipeDeckIds.length > 0) startCardPreview(state.swipeDeckIds[0]);
  }

  function createSwipeCard(track, isTop) {
    const card = document.createElement('div');
    card.className = `swipe-card ${isTop ? 'top' : 'behind'}`;

    const chipsHtml = state.customVibes.map(v => {
      const on = track.vibes.includes(v.id);
      return `<button class="cv-chip ${on ? 'on' : ''}" data-vid="${v.id}">${escapeHtml(v.name)}</button>`;
    }).join('') + `<button class="cv-chip add-chip" data-add="1">+</button>`;

    const centeredClass = state.customVibes.length <= 3 ? 'centered' : '';

    card.innerHTML = `
      <div class="card-art-wrap">
        ${buildArtImgHtml(track)}
        ${isTop ? '<div class="card-preview-badge"></div>' : ''}
        <div class="swipe-stamp"><div class="stamp-label"></div></div>
      </div>
      ${isTop ? `
        <div class="card-scrubber" title="Перемотка превью">
          <div class="card-scrub-track"><div class="card-scrub-fill"></div></div>
        </div>
      ` : ''}
      <div class="card-info">
        <div class="card-title">${escapeHtml(track.title)}</div>
        <div class="card-artist">${escapeHtml(track.artist)}</div>
        <div class="card-vibe-chips ${centeredClass}">${chipsHtml}</div>
      </div>
    `;

    if (isTop) {
      const chipWrap = card.querySelector('.card-vibe-chips');
      chipWrap.addEventListener('pointerdown', e => e.stopPropagation());

      card.querySelectorAll('.cv-chip').forEach(chip => {
        chip.addEventListener('click', e => {
          e.stopPropagation();
          if (chip.dataset.add) {
            openVibesModal();
            return;
          }
          const vid = chip.dataset.vid;
          const idx = track.vibes.indexOf(vid);
          if (idx === -1) track.vibes.push(vid);
          else track.vibes.splice(idx, 1);
          chip.classList.toggle('on', idx === -1);
          if (state.queuesByVibe[vid]) syncVibeQueue(vid);
          renderRightDropRail();
          saveState();
          haptic(1);
        });
      });

      const scrubber = card.querySelector('.card-scrubber');
      let cardScrubbing = false;
      const seekCard = clientX => {
        const rect = scrubber.getBoundingClientRect();
        const rel = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        if (previewTrackId !== track.id) {
          startCardPreview(track.id);
        }
        previewTime = rel * (track.duration || 1);
        if (IS_NATIVE) window.ShardNative.seekPreview(Math.floor(previewTime * 1000));
        updateCardPreviewUI();
      };
      scrubber.addEventListener('pointerdown', e => {
        e.stopPropagation();
        cardScrubbing = true;
        scrubber.setPointerCapture(e.pointerId);
        seekCard(e.clientX);
      });
      scrubber.addEventListener('pointermove', e => {
        if (!cardScrubbing) return;
        e.stopPropagation();
        seekCard(e.clientX);
      });
      scrubber.addEventListener('pointerup', e => {
        e.stopPropagation();
        cardScrubbing = false;
      });
      scrubber.addEventListener('pointercancel', () => { cardScrubbing = false; });

      attachCardPhysics(card, track.id);
    }

    return card;
  }

  function attachCardPhysics(card, trackId) {
    let sx = 0, sy = 0, dragging = false;
    let hoveredVibeId = null;
    let crossedThreshold = false;
    let movedDist = 0;
    const stamp = card.querySelector('.swipe-stamp');
    const stampLabel = card.querySelector('.stamp-label');
    const rail = document.getElementById('right-drop-rail');

    card.addEventListener('pointerdown', e => {
      if (isSwipeAnimating) return;
      if (e.clientX < EDGE_SAFE_PX || e.clientX > window.innerWidth - EDGE_SAFE_PX) return;
      closeQuickVibePop();
      dragging = true;
      sx = e.clientX;
      sy = e.clientY;
      movedDist = 0;
      hoveredVibeId = null;
      crossedThreshold = false;
      card.setPointerCapture(e.pointerId);
      card.style.transition = 'none';
      const behind = document.querySelector('.swipe-card.behind');
      if (behind) behind.style.transition = 'none';
    });

    card.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      movedDist = Math.hypot(dx, dy);

      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * 0.045}deg)`;

      const behind = document.querySelector('.swipe-card.behind');
      if (behind) {
        const p = Math.min(1, movedDist / 140);
        behind.style.transform = `scale(${0.92 + p * 0.06}) translateY(${16 - p * 12}px)`;
        behind.style.opacity = String(0.38 + p * 0.48);
      }

      const absX = Math.abs(dx), absY = Math.abs(dy);

      if (dx > 34 && absX > absY * 0.72 && state.customVibes.length > 0) {
        rail.classList.add('visible');
        const slots = rail.querySelectorAll('.drop-vibe-slot');
        let bestSlot = null, bestDist = Infinity;
        slots.forEach(s => {
          const r = s.getBoundingClientRect();
          const dist = Math.abs(e.clientY - (r.top + r.height / 2));
          if (dist < bestDist) { bestDist = dist; bestSlot = s; }
          s.classList.remove('highlight');
        });
        if (bestSlot) {
          bestSlot.classList.add('highlight');
          if (hoveredVibeId !== bestSlot.dataset.vibeId) {
            hoveredVibeId = bestSlot.dataset.vibeId;
            haptic(1);
          }
        }
      } else {
        rail.classList.remove('visible');
        hoveredVibeId = null;
      }

      const over = Math.max(absX, absY) > 84;
      if (over && !crossedThreshold) {
        crossedThreshold = true;
        haptic(1);
      } else if (!over && crossedThreshold) {
        crossedThreshold = false;
      }

      if (Math.max(absX, absY) > 26) {
        stamp.style.opacity = Math.min(1, Math.max(absX, absY) / 108);
        if (hoveredVibeId) {
          const v = getVibeById(hoveredVibeId);
          stampLabel.textContent = v ? v.name.toUpperCase() : 'ВАЙБ';
        } else if (absX > absY) {
          stampLabel.textContent = dx < 0 ? 'В ПОТОК' : (state.customVibes.length ? 'ВЫБЕРИ ВАЙБ' : 'НЕТ ВАЙБОВ');
        } else {
          stampLabel.textContent = dy < 0 ? 'ЛЮБИМОЕ' : 'СКРЫТЬ';
        }
      } else {
        stamp.style.opacity = 0;
      }
    });

    const snapBack = () => {
      card.style.transition = 'transform 0.24s var(--ease)';
      card.style.transform = 'translate(0,0) rotate(0deg)';
      stamp.style.opacity = 0;
      resetBehindCard();
    };

    const end = e => {
      if (!dragging) return;
      dragging = false;
      rail.classList.remove('visible');
      rail.querySelectorAll('.drop-vibe-slot').forEach(s => s.classList.remove('highlight'));

      if (movedDist < 8 && e.target.closest('.card-art-wrap')) {
        snapBack();
        toggleCardPreview(trackId);
        return;
      }

      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      const absX = Math.abs(dx), absY = Math.abs(dy);

      if (hoveredVibeId && dx > 70) {
        animateAndApplySwipe(card, 'right', hoveredVibeId);
      } else if (Math.max(absX, absY) > 84) {
        const dir = absX > absY ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
        if (dir === 'right') {
          if (state.customVibes.length > 0) {
            animateAndApplySwipe(card, 'right', state.customVibes[0].id);
          } else {
            snapBack();
            showToast('Сначала создай хотя бы одно настроение');
          }
        } else {
          animateAndApplySwipe(card, dir);
        }
      } else {
        snapBack();
      }
    };

    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }

  function resetBehindCard() {
    const behind = document.querySelector('.swipe-card.behind');
    if (!behind) return;
    behind.style.transition = 'transform 0.24s var(--ease), opacity 0.24s ease';
    behind.style.transform = '';
    behind.style.opacity = '';
  }

  function triggerSwipeAction(dir, targetVibeId = null) {
    if (isSwipeAnimating) return;
    const topCard = document.querySelector('.swipe-card.top');
    if (topCard) animateAndApplySwipe(topCard, dir, targetVibeId);
  }

  function animateAndApplySwipe(card, dir, targetVibeId = null) {
    if (isSwipeAnimating) return;
    isSwipeAnimating = true;
    haptic(2);

    const wasPreviewing = previewPlaying;
    stopPreview();

    const tx = dir === 'left' ? -430 : dir === 'right' ? 430 : 0;
    const ty = dir === 'up' ? -430 : dir === 'down' ? 430 : 0;
    card.style.transition = 'transform 0.22s var(--ease), opacity 0.18s ease';
    card.style.transform = `translate(${tx}px, ${ty}px) rotate(${tx * 0.05}deg)`;
    card.style.opacity = '0';

    const behind = document.querySelector('.swipe-card.behind');
    if (behind) {
      behind.style.transition = 'transform 0.22s var(--ease), opacity 0.18s ease';
      behind.style.transform = 'scale(1) translateY(0)';
      behind.style.opacity = '1';
    }

    setTimeout(() => {
      const id = state.swipeDeckIds.shift();
      const track = getTrack(id);

      if (track) {
        state.swipeHistory.push({
          id,
          dir,
          prevLiked: track.liked,
          prevHidden: track.hidden,
          prevVibes: [...track.vibes],
          prevScore: track.score
        });
        if (state.swipeHistory.length > MAX_UNDO) state.swipeHistory.shift();

        if (dir === 'left') {
          showToast('Оставлено в Потоке');
        } else if (dir === 'right' && targetVibeId) {
          if (!track.vibes.includes(targetVibeId)) track.vibes.push(targetVibeId);
          adjustScore(track, 4);
          if (state.queuesByVibe[targetVibeId]) syncVibeQueue(targetVibeId);
          const v = getVibeById(targetVibeId);
          showToast(v ? `В «${v.name}»` : 'Добавлено в вайб');
        } else if (dir === 'up') {
          track.liked = true;
          adjustScore(track, 12);
          if (state.queuesByVibe.fav) syncVibeQueue('fav');
          showToast('В Любимом');
        } else if (dir === 'down') {
          hideTrackById(id);
          showToast('Скрыто');
        }
      }

      isSwipeAnimating = false;
      saveState();
      renderSwipeDeck();
      renderFlow();

      if (wasPreviewing && state.swipeDeckIds.length > 0) {
        startCardPreview(state.swipeDeckIds[0]);
      }
    }, 200);
  }

  function undoLastSwipe() {
    if (isSwipeAnimating) return;
    const last = state.swipeHistory.pop();
    if (!last) { showToast('Нечего отменять'); return; }

    stopPreview();
    const track = getTrack(last.id);
    if (track) {
      track.liked = last.prevLiked;
      track.hidden = last.prevHidden;
      track.vibes = [...last.prevVibes];
      track.score = last.prevScore;
      if (!track.hidden) {
        Object.keys(state.queuesByVibe).forEach(vibeId => syncVibeQueue(vibeId));
      }
    }
    if (!state.swipeDeckIds.includes(last.id)) {
      state.swipeDeckIds.unshift(last.id);
    }

    saveState();
    renderSwipeDeck();
    renderFlow();
    haptic(1);
    showToast('Свайп отменён');
  }

  // --- Утилиты ---
  function fmtTime(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${r < 10 ? '0' : ''}${r}`;
  }

  let toastTimer = null;
  function showToast(msg, actionLabel = null, onAction = null) {
    const el = document.getElementById('toast');
    const msgEl = document.getElementById('toast-msg');
    const actEl = document.getElementById('toast-act');

    msgEl.textContent = msg;
    if (actionLabel && typeof onAction === 'function') {
      actEl.textContent = actionLabel;
      actEl.style.display = 'inline-block';
      actEl.onclick = () => {
        clearTimeout(toastTimer);
        el.classList.remove('show', 'has-action');
        onAction();
      };
      el.classList.add('has-action');
    } else {
      actEl.style.display = 'none';
      actEl.onclick = null;
      el.classList.remove('has-action');
    }

    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('show', 'has-action');
    }, actionLabel ? 3600 : 1850);
  }

  function renderAll() {
    document.body.classList.toggle('bw-mode', state.bwMode);
    document.getElementById('bw-btn').classList.toggle('active', state.bwMode);
    document.getElementById('unsorted-badge').textContent = state.swipeDeckIds.length;
    renderVibesBar(true);
    renderFlow();
    if (state.activeTab === 'swipe') renderSwipeDeck();
  }

  // Старт приложения
  loadState();
  renderAll();
  if (state.activeTab === 'swipe') {
    switchTab('swipe', true);
  }
  scanDeviceLibrary(false);
</script>
</body>
</html>
